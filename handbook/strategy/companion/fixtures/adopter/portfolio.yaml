# The synthetic adopter's portfolio (40-BREADTH.md step 9): measured and input values only, each input naming its
# supplier; one estate-local initiative its own trigger event spawned (defined and judged; the board ranks the register's initiatives the estate plans); a role assigned to two departments in two scopes;
# two exceptions, one expired and one renewed twice. Its records are the two synthetic ones beside it, never the
# reference estate's. Every name a placeholder or the adopter's own word.
