      - {id: price-input-review, loop: "Read each price input as set or at its reference value, and correct the ones left at the reference", runner: platform-team, cadence: P3M, trigger: [schedule], toil: toil, toil_reason: "manual: the record says which inputs match the reference; a person decides and enters each value", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/cost-showback"], what: "[[ch:cost-showback]]'s plate 04: the price inputs read again each quarter"}]}
      - {id: showback-publish, loop: "Assemble and send each owner's report on its schedule", runner: platform-team, cadence: P1M, trigger: [schedule], toil: toil, toil_reason: "manual until the report is generated; repetitive and automatable", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: untaught, what: "no published page teaches what each owner receives and on what schedule", category: "the showback report per owner", lane: "3c", message: {sent: "2026-10-30", answer: "partly taught; what each owner receives and on what schedule is untaught under 3c, queued for cost-showback's next revision with no date (3c, 2026-10-30)", answered: "2026-10-30"}}]}
      - {id: drift-read, loop: "Read the coverage, the composition, the price inputs and the groups' cost keys", runner: platform-team, cadence: P1W, trigger: [schedule], toil: engineering, toil_reason: "carried by a companion; a person reads only its findings", carried_by: "deploy/privatecloudarchitect/companion/staging/handbook/cost-showback/coverage.py", effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/cost-showback"], what: "[[ch:cost-showback]]'s plate 02: the coverage read on the cadence"}]}
      - {id: instrument-upkeep, loop: "Keep the coverage gate running and check it against each release's cost keys", runner: platform-team, cadence: P1M, trigger: [schedule, release], toil: engineering, toil_reason: "the upkeep an automation carries as its own sustain loop (research/r2 G2)", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: untaught, what: "the strategy layer's own instruments, which no handbook page teaches", category: "the strategy layer's instrument upkeep", lane: "64", message: {sent: "2026-10-30", answer: "the strategy pages of PH4; the upkeep stays each capability's sustain loop (DEC-18)", answered: "2026-10-30"}}]}
    value:
      - id: month-to-date-cost-coverage
        serves: "a figure that can be defended"
        category: evidence
        outcome: "The densest cost key reports for every machine"
        measure: "share of machines (templates excluded, since they carry no cost) the densest month-to-date key reports for"
        measure_note: "the record's coverage block for the densest key, its unreached objects less the templates among them (the record's unreachedThatAreTemplates)"
        unit: "percent of machines"
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/cost-showback/coverage.py (the coverage block and the templates among the unreached)"
        direction: higher
        target_owner: platform-team
