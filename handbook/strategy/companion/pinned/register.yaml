  - id: access-lifecycle
    object_in_focus: "every person's access to the platform's organizations: the accounts, sessions and tokens kept after a removal at the provider, the roles that reach a person, and the names that may come back"
    parent: null
    outcome: "A person who leaves loses access through one action at the provider and a close run on a scheduled report's alert, inside the latency your estate accepts; every role reaches a person through an imported group; no departed person's name reaches an account"
    scope: platform
    accountable: identity-team
    jobs: [identity-operations]
    taught_by: [identity-lifecycle]
    links: []
    untaught: []
    relates_to:
      - route: operate-identity
        promise: "in an organization federated to a provider a person who leaves loses access through one action at the provider, a scheduled report that alerts on what the platform kept, and a close you run on its alert"
        how: derived
        reason: >-
          The capability holds the promise as a ledger: the report scheduled per tenant, the close proven and run on
          the alert, the latency stated and the leaver test kept; it measures what the route states, the leavers open,
          and carries the hours from alert to close until its read is built.
      - route: federate-a-tenant
        promise: "admitted only through both gates with roles from groups"
        how: linked
        reason: >-
          The lifecycle rests on the admission path tenant-federation and access-control teach together: a role that
          reaches a person through an imported group leaves with the person, so one action at the provider ends a
          mover's old rights and a leaver's access; a role granted to the user is the exception the report flags.
    declarations:
      - {system: vcf-automation, system_name: "VCF Automation", object: "federation settings of each organization (the issuer or the metadata that names its tenant) and the imported groups that carry its roles", writer: identity-team}
      - {system: repo, system_name: "the repository", object: "schedule of the report: one run per tenant on a provider API token, the tenant list every run is given (--expect-tenants), its interval, the owner its alert reaches, and the dated record file of each scheduled run and of each close a person runs (OUT names one file, written as given, in a folder that exists)", writer: identity-team}
      - {system: repo, system_name: "the repository", object: "revocation latency your estate accepts per organization, and the flags a person has decided on with their dates (--ack)", writer: identity-team}
    drift_read: {companion: handbook/identity-lifecycle, check: "the report: every organization federated to the tenant found from its own settings; each account kept, a leaver, out of scope or undetermined on three agreeing reads, a leaver in step or open; direct roles and names in use again flagged; the run's own token read against its warning window (leavers.py)"}
    agent_entries:
      - {stack: operating, layer: identity, acts: "review grants, flag stale accounts, rotate credentials"}
    establish:
      - id: direct-roles-moved
        step: "Every role on a federated account moved into an imported group, the direct roles read first, so a leaver's rights end with the person and an account enabled again hands nothing back"
        requires: []
        proven_by: "the report's direct-role count at zero across every federated organization"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/identity-lifecycle"], what: "[[ch:identity-lifecycle]]'s plate 01: grant every role through an imported group, and read the direct roles before you trust a leaver procedure"}
      - id: report-scheduled
        step: "The report scheduled on a provider API token, one run per tenant of the provider with the same tenant list on each, alerting on every exit but 0 to a named owner, each run's record kept under its date"
        requires: []
        proven_by: "the standing schedule on record with its tenant list, alert owner and record path, and a run's record kept under its date by it"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/identity-lifecycle"], what: "[[ch:identity-lifecycle]]'s plate 03: report on a schedule, one run per tenant on the job's provider API token, and alert on any non-zero exit"}
      - id: close-proven
        step: "The close proven on your estate once: a leaver's tokens revoked and its account disabled on a provider bearer, both read back, the re-run reading it in step"
        requires: []
        proven_by: "a dated record of one leaver closed end to end: the token refused on its next refresh, the account read back disabled, the re-run in step"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/identity-lifecycle", "/handbook/platform-identity"], what: "[[ch:identity-lifecycle]]'s plate 03: the close, run on a provider bearer, revokes the tokens and disables the account and reads both back; [[ch:platform-identity]]'s plate 04, the provider sign-in it runs from"}
      - id: latency-stated
        step: "The revocation latency your estate accepts stated per organization, the report's interval set within it, its alert's owner answering inside it, and token lifetimes set where they are a setting"
        requires: [step:report-scheduled]
        proven_by: "the stated latency on record beside the schedule, the interval within it, and every reported token ending or revoked inside it"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/identity-lifecycle", "/handbook/platform-identity"], what: "[[ch:identity-lifecycle]]'s plate 04: hold tokens inside the latency you accept, the report's interval within it; [[ch:platform-identity]]'s plate 02, both lifetimes set when a broker token is created"}
      - id: names-held
        step: "A departed account kept disabled with its direct roles dropped and the report's name check at zero, so a name that comes back reaches nothing and an account enabled again hands nothing back"
        requires: [step:direct-roles-moved]
        proven_by: "the report's name check at zero, and no disabled account holding a direct role"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/identity-lifecycle"], what: "[[ch:identity-lifecycle]]'s plate 05: never give a departed person's name to someone new; keep the departed account disabled and drop its direct roles"}
      - id: leaver-test-kept
        step: "The leaver test run after any change to the provider, the job or the token lifetimes, each run's record kept with its date"
        requires: [step:close-proven, step:latency-stated]
        proven_by: "a dated test record newer than the last change to the provider, the job or the lifetimes: sign-in and token refused and the account disabled inside the stated latency"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/identity-lifecycle"], what: "[[ch:identity-lifecycle]]'s plate 06: prove it with the leaver test, after any change to the provider, the job or the token lifetimes"}
      - id: broker-leavers
        step: "The broker's own just-in-time and synchronized users closed on removal at their directory or provider: tokens stopped by the inactive-user setting or ended by a sync shown to close the user, a session counted to its hour, proven by a run"
        requires: []
        proven_by: "a dated record of one broker user removed at its source, its token refused and its account read back inactive"
        investment_unit: person-days
        handoff:
          - {kind: untaught, what: "the broker's own leavers are untaught: the chapter documents the broker's half and runs none of it (a just-in-time user's tokens may stay valid to their lifetime, a synchronized user is read again at the directory's next sync and whether a removal then closes it is not stated, SCIM leaves deactivation to the provider)", category: "the broker's own leavers", lane: "64", message: {sent: "2026-10-31", answer: "held by 64 (N6, charter section 5.10): identity-lifecycle documents the broker's half and runs none of it; a revision runs it on the directory-synced realm your estate has, a removal read for its effect at the next sync, and on a realm provisioned by just-in-time or SCIM once one stands on your estate (charter section 10, 2026-10-31)", answered: "2026-10-31"}}
    sustain:
      - {id: report-and-close, loop: "Run the report on its schedule; on its alert, close each open leaver on a provider bearer and read it back, the close's record kept under its date beside the schedule's, decide and acknowledge each flag, and rotate the report's own token when it flags", runner: identity-team, cadence: P1D, trigger: [schedule], toil: engineering, toil_reason: "carried by the companion's scheduled run; the close and each flag's decision are a person's, on the alert", carried_by: "deploy/privatecloudarchitect/companion/staging/handbook/identity-lifecycle/leavers.py", effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/identity-lifecycle"], what: "[[ch:identity-lifecycle]]'s plate 03: the scheduled report alerts on a leaver only when three reads agree, and the close reads both writes back"}]}
      - {id: leaver-test, loop: "Run the leaver test after each change to the provider, the job or the token lifetimes, and keep the run's record with its date", runner: identity-team, cadence: P3M, trigger: [schedule, release], toil: toil, toil_reason: "a person removes a test user at the provider and runs the test; the companion reads, it does not stage", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/identity-lifecycle"], what: "[[ch:identity-lifecycle]]'s plate 06: the test user removed at the provider is refused at sign-in, refused a new access token and disabled inside the stated latency"}]}
      - {id: drift-read, loop: "Read every organization federated to the tenant from its own settings against the schedule's tenant list and the gate each declares, and the report's own token against its warning window", runner: identity-team, cadence: P1W, trigger: [schedule], toil: engineering, toil_reason: "carried by the companion; a person reads only its flags", carried_by: "deploy/privatecloudarchitect/companion/staging/handbook/identity-lifecycle/leavers.py", effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/identity-lifecycle"], what: "[[ch:identity-lifecycle]]'s plate 03: the report finds every federated organization from its own settings and reads its own token's end date on every run"}]}
      - {id: instrument-upkeep, loop: "Keep the report running against each new organization, each provider key rollover and each release of VCF Automation", runner: identity-team, cadence: P1M, trigger: [schedule, release], toil: engineering, toil_reason: "the upkeep an automation carries as its own sustain loop (research/r2 G2)", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: untaught, what: "the strategy layer's own instruments, which no handbook page teaches", category: "the strategy layer's instrument upkeep", lane: "64", message: {sent: "2026-10-30", answer: "the strategy pages of PH4; the upkeep stays each capability's sustain loop (DEC-18)", answered: "2026-10-30"}}]}
