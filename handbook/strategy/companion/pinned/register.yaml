# The enterprise strategy layer's universal register (charter 00-CHARTER.md, sections 5 and 7; D-055).
#
# Definitions only: roles, capabilities, initiatives, drivers, the watch list, signals, scans, trigger events and
# guidance assessments. Never an estate's state, figures, plans or decisions: those live in a portfolio
# (portfolio.example.yaml is the reference estate's). Written in PH1 step 5 (2026-10-25) and corrected on PH1's audit;
# the catalog grows in PH4 and through the proactive and reactive cycles (REQ-21). Every external source was fetched on
# 2026-10-25; the strand records under research/ hold its quotes. Fields marked `derived` are computed by the generator
# from PH3, never typed. The method's parameters and the closed vocabularies are policy.yaml's (charter section 5.12).

schema: 8
fixed: "2026-10-25"

roles:                                   # generic; a portfolio assigns each to one department per scope
  - {id: architecture-office, name: "Architecture office", owns: "the strategy practice itself: the register, the portfolio, the cadence"}
  - {id: platform-team, name: "Platform team"}
  - {id: security-team, name: "Security team"}
  - {id: risk-team, name: "Risk and compliance"}
  - {id: observability-team, name: "Observability team"}
  - {id: identity-team, name: "Identity team"}
  - {id: application-team, name: "Application team"}

# The front door (schema 6; DEC-06, 50-FRONT-DOOR.md sections 8 and 9): the three readers the layer serves (charter
# section 6), in the order the landing page shows them, each with the door the page draws for them in both layers. The
# question is the charter's; the title and the promise are the door's typed lines, one each, corrected in the design
# brief (docs/design/front-door/00-BRIEF.md); the paths are the views and pages the door opens, every
# strategy path one the policy publishes and every handbook path one the site serves (GATE-15); a path whose heading
# would mislead out of its page carries its own words, `{path, words}` (schema 7), and each door states the order a
# reader meets its two layers, the one its title names first leading (schema 8). A door written `roles`
# in both layers is derived by the generator: one brief per role, and the chapters that teach the capabilities the
# role's brief shows. The generator emits the feed the home renderer reads; nothing on the landing page restates it.
readers:
  - id: architect
    name: "The architect"
    question: "Which capabilities, in what order, owned by whom, worth what, at what cost, invested in when, and why"
    door:
      title: "The map and the catalog"
      order: [handbook, strategy]       # the map first, as the title names it
      promise: "Every chapter on its route, and every capability with its returns, costs and drivers."
      strategy:
        - "/strategy"
        - {path: "/strategy/drivers", words: "Drivers: the outside changes that re-open the plan"}
      handbook: ["/handbook/"]
  - id: department-operator
    name: "The department operator"
    question: "What is ours, what do we establish once, what do we keep doing, what does it cost, how do we show it works, how do we know we have drifted"
    door:
      title: "Your role's brief and chapters"
      order: [strategy, handbook]       # the brief first, as the title names it
      promise: "Your team's role brief and the chapters that teach its part in the strategy."
      strategy: roles
      handbook: roles
  - id: decision-maker
    name: "The decision-maker"
    question: "What do we get, what does it cost, what does waiting cost, what changes the plan"
    door:
      title: "The board and the one-way decisions"
      order: [strategy, handbook]       # the board first, as the title names it
      promise: "What to fund first, what it costs to keep, and which decisions cannot be undone cheaply."
      strategy: ["/strategy/board", "/strategy/costs-and-value"]
      handbook:
        - "/handbook/identity-decisions"
        - {path: "/notes/capacity-in-and-out#twelve-decisions-to-treat-as-one-way-and-how-firmly-each-is-known", words: "Capacity decisions to treat as one-way, in a field note"}

# Capabilities the catalog defines in PH4, named because an initiative already stands on them. A prerequisite that
# names one resolves (GATE-5); no initiative establishes them yet, so an initiative that requires one cannot be
# committed (GATE-8), and a portfolio with no state for one reads it as not established (charter section 5.7).
planned_capabilities:                    # step 5's initiatives name three prerequisites no capability holds (40-BREADTH step 5); each written in a step 4 batch after step 5 by its lane, untaught where the reference estate has nothing to teach from
  - physical-network-telemetry           # 3c, Part IV: required by estate-telemetry-for-agents (charter 5.10 row 1); named by the charter's lane list and M17, by no catalog-map row (step 13 judges whether the map gains one); accountable to observability-team, bounded by the domain collector metrics-topology names
  - ai-assisted-detection-and-response   # 3c, with f8's word on the platform-change side: established by model-assisted-detection (row 2); accountable to security-team
  - supply-chain-validation              # f8, platform-upkeep: established by estate-supply-chain-validation (row 5)

capabilities:
  - id: fleet-patch-window
    object_in_focus: "the fleet's ESX hosts against published advisories"
    parent: null
    outcome: "A published advisory is closed across the fleet within its target window"
    scope: platform
    accountable: platform-team
    jobs: [platform-upkeep]
    taught_by: [host-lifecycle, platform-lifecycle]
    links: [/notes/day2-patching-and-hardening]
    untaught: []
    relates_to:
      - route: maintain-the-platform
        promise: "every host is built from its cluster's declared image and held to the cluster's configuration profile"
        how: divergent
        reason: >-
          The route's promise holds each host to its declaration; this capability adds the time from an advisory's
          publication to every host running the fixed build, which no route promises today.
    declarations:
      - {system: vcenter, system_name: "vCenter", object: "cluster image", writer: platform-team}
    drift_read: {companion: handbook/host-lifecycle, check: "image compliance (a stored result with its own evaluation time)"}
    agent_entries:
      - {stack: operating, layer: "hosts and lifecycle", acts: "triage advisories, stage and remediate images"}
    establish:
      - {id: images-declared, step: "Every cluster on a declared image", requires: [], proven_by: "hostlife.py: every cluster image-managed, with its declared base image", investment_unit: person-days, handoff: [{kind: taught, pages: ["/handbook/host-lifecycle"], what: "[[ch:host-lifecycle]]'s plate 01: every host declared twice, by the cluster's image and its configuration profile"}]}
      - {id: compliance-read-scheduled, step: "The image-compliance read running on its cadence", requires: [step:images-declared], proven_by: "a dated run record of hostlife.py per cadence", investment_unit: person-days, handoff: [{kind: taught, pages: ["/handbook/host-lifecycle"], what: "the chapter's companion, hostlife.py, and its read of each cluster's stored image compliance, the compliance [[ch:host-lifecycle]]'s plate 01 gives every image"}]}
      - {id: window-agreed, step: "A target window per advisory severity agreed with the security team", requires: [], proven_by: "the portfolio's target for advisory-to-fixed-build, with who set it and when", investment_unit: person-days, handoff: [{kind: untaught, what: "no published page teaches a target window per advisory severity; field note 09's severity is Security Posture Management's scoring", category: "a target window per advisory severity", lane: f8, message: {sent: "2026-10-28", answer: "accepted with no schedule, most likely in field note 09's next revision", answered: "2026-10-28"}}]}
      - {id: staging-and-remediation-procedure, step: "A staging and remediation procedure for each cluster, rehearsed once", requires: [step:images-declared], proven_by: "a record of one staged remediation, read from the platform's task records", investment_unit: person-days, handoff: [{kind: taught, pages: ["/handbook/host-lifecycle"], what: "the remediation half: [[ch:host-lifecycle]]'s plate 04, where the cluster's image remediates a host"}, {kind: served, pages: ["/notes/day2-patching-and-hardening"], what: "its steps 6 and 7: plan and pre-check, then Live Patch or rolling maintenance mode"}, {kind: taught, pages: ["/handbook/platform-lifecycle"], what: "the readiness and rehearsal half: [[ch:platform-lifecycle]]'s plate 02 (offered is not available) and [[ch:platform-lifecycle]]'s plate 03 (the stagger and the rehearsal instance), and the weekly join before a window is booked"}]}
      - {id: advisory-record, step: "Each advisory read into a dated record: publication date, revision, and the fixed build per release line", requires: [], proven_by: "the PH2 advisory reader's record", investment_unit: person-days, handoff: [{kind: served, pages: ["/notes/day2-patching-and-hardening"], what: "the reading half: its step 1, the fixed build per product line, patches cumulative"}]}
      - {id: per-host-series, step: "Each ESX host's version and running build read into a dated series under a key stable across runs", requires: [], proven_by: "the dated series's first keyed reading (20-PILOT.md step 3), from hostlife.py --host-builds", investment_unit: person-days, handoff: [{kind: served, pages: ["https://github.com/privatecloudarchitect/privatecloudarchitect.com/blob/main/handbook/host-lifecycle/README.md"], what: "the companion's --host-builds read; the chapter does not teach the running build yet, and its next revision is Part III's"}]}
    sustain:
      - {id: patch-loop, loop: "Read each advisory; sync the fixed build into the Software depot in VCF Operations' Binary Management; build the fixed image in vCenter's Image Library and import it into the VCF instance, with SDDC Manager as the engine for ESX; plan and pre-check the upgrade in VCF Operations, then remediate each cluster to its image", runner: platform-team, cadence: P1M, trigger: [schedule, advisory], toil: toil, toil_reason: "manual, repetitive and automatable (the SRE book's attributes, research/r2 G1); the target of agentic-patch-triage", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: served, pages: ["/notes/day2-patching-and-hardening"], what: "its eight steps from the notice to a compliant cluster"}]}
      - {id: drift-read, loop: "Read each cluster's stored image compliance with its own evaluation time", runner: platform-team, cadence: P1W, trigger: [schedule], toil: engineering, toil_reason: "carried by a companion; a person reads only its findings", carried_by: "deploy/privatecloudarchitect/companion/staging/handbook/host-lifecycle/hostlife.py", effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/host-lifecycle"], what: "the stored compliance read with its own evaluation time"}]}
      - {id: instrument-upkeep, loop: "Keep the image-compliance read, the advisory reader and the per-host series running, and check the parse rule on each new advisory", runner: platform-team, cadence: P1M, trigger: [schedule, advisory], toil: engineering, toil_reason: "the upkeep an automation carries as its own sustain loop (research/r2 G2)", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: untaught, what: "the strategy layer's own instruments, which no handbook page teaches", category: "the strategy layer's instrument upkeep", lane: "64", message: {sent: "2026-10-30", answer: "the strategy pages of PH4; the upkeep stays each capability's sustain loop (DEC-18)", answered: "2026-10-30"}}]}
    value:
      - id: advisory-to-fixed-build
        serves: "vulnerabilities closed before they are exploited"
        category: exposure
        outcome: "Advisory to a fleet on the fixed build"
        measure: "days from an advisory's publication to every host running a build at or above the fixed build the advisory lists for that host's release line"
        measure_note: >-
          Field note 09 closes a patch change only on three reads: "the image compliance scan, the configuration
          profile's compliance, and a fresh posture assessment. The first says the build landed; the other two say it
          did not undo the hardening." This measure reads the first only: closed means the fixed build runs on every
          host; whether the change undid the hardening is not read here.
        unit: "days per advisory"
        stages: [vendor-lag, declaration-lag, remediation-lag]   # a lead time, each stage clamped at the publication; an image released before it is reported beside the vendor's stage
        paired_with: failed-host-remediation-share               # a lead time is paired with a stability measure (research/r2 H1)
        instrument: "docs/design/enterprise-strategy-layer/instrument/series.py (20-PILOT.md step 3) and docs/design/enterprise-strategy-layer/instrument/advisory.py (20-PILOT.md step 4), over hostlife.py --host-builds, beside the depot and the declared images (R-08; G-781, G-308)"
        direction: lower
        target_owner: platform-team
      - id: exposure-days-past-window
        serves: "vulnerabilities closed before they are exploited"
        category: exposure
        outcome: "No advisory stays open past its target window"
        measure: "per month, the sum over advisories of the days each stayed open past its target window"
        unit: "advisory-days per month"
        stages: []
        paired_with: null
        instrument: "derived from the same series and advisory records"
        direction: lower
        target_owner: platform-team
      - id: failed-host-remediation-share
        serves: "stable remediation"
        category: resilience
        outcome: "Remediations complete on every host"
        measure: "per quarter, the share of observed cluster remediations whose result lists a failed host"
        measure_note: >-
          Not the share that needed a person to intervene, which no field the read returns records: vSphere Lifecycle
          Manager keeps each cluster's last remediation with its status, start and end times and its failed, skipped and
          successful hosts, and no field names a person or an intervention (read on the reference estate, 9.1.1, the
          REST last-apply-result). Scoped to that endpoint: a failed host needing a person to finish is inferred (a retry
          could finish it); skipped hosts are read beside, unexplained until a source defines them; only the last
          remediation is kept, so remediations are counted once each by cluster and start time across readings and the
          denominator is remediations observed, a lower bound. Who intervened is an open question: vCenter's task and
          event history was not read.
        unit: "percent per quarter"
        stages: []
        paired_with: null
        instrument: "each image-managed cluster's last_remediation, kept per reading by deploy/privatecloudarchitect/companion/staging/handbook/host-lifecycle/hostlife.py --host-builds and the dated series (20-PILOT.md steps 2b and 3)"
        direction: lower
        target_owner: platform-team

