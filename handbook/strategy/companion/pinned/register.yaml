  - id: safe-actuation
    object_in_focus: "a change an automation or an agent makes to the platform"
    parent: null
    outcome: "A change made by an automation or an agent is dry-run first, safe to run twice, confirmed by a re-read, and held for a person's approval where its blast radius warrants it"
    scope: platform
    accountable: platform-team
    jobs: [automation]
    taught_by: [resilient-api-call]
    links: []
    untaught: []
    relates_to:
      - {route: automate-the-platform, promise: "make idempotent calls that survive token expiry, response drift, and retries", how: derived}
      - route: automate-the-platform
        promise: "make idempotent calls that survive token expiry, response drift, and retries"
        how: divergent
        reason: >-
          The route's promise ends at the call; this capability adds the re-read that confirms the effect and the
          approval that holds a consequential change for a person, which no route promises today.
    declarations:
      - {system: pca, system_name: "the platform engine", object: "dry-run path on every mutating operation", writer: platform-team}
      - {system: vcf-automation, system_name: "VCF Automation", object: "approval on destroy and the lease, as Day-2 action policies", writer: platform-team}
    drift_read: {not_covered: "no companion reads your estate's automations for a dry-run path or confirms their changes by a re-read; the resilient client's guarantees are proven offline by its own tests, which is one client, not an estate"}
    agent_entries:
