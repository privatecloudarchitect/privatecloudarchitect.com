        category: evidence
        outcome: "The six daily basis keys report wherever the densest key does"
        measure: "share of the machines the densest key covers on which the six daily basis keys (allocation-based and demand-based cpu, memory and storage) report"
        measure_note: "the basis keys are the ones to watch, as the chapter's coverage gate teaches: a key inside the densest key's objects drops the difference when summed, and nothing in its values marks it"
        unit: "percent of machines"
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/cost-showback/coverage.py (the spread block, the basis keys' level against the densest)"
        direction: higher
        target_owner: platform-team
      - id: populated-groups-without-a-cost-key
        serves: "showback the groups can carry"
        category: evidence
        outcome: "Every group of the declared cost-carrying tree carries a cost figure"
        measure: "groups of the declared cost-carrying tree carrying neither a cost key nor the member-summing super metric the build adds, per reading"
        unit: "groups per reading"
        stages: []
        paired_with: null
        instrument: {not_covered: "coverage.py counts only the keys that start with cost| on a group, and the build the chapter teaches is a super metric summing the members' cost, whose key is not one, so the companion cannot see the fix it asks for; 3c takes the read into cost-showback's next revision (coverage.py reads the declared showback groups, an input it gains, then on each the stat key of the super metrics whose formula reads a cost key; its positive case needs a throwaway super metric on a throwaway group, a lab write asked of the operator), the value carried until it lands (3c, 2026-10-30)", lane: "3c"}
        direction: lower
        target_owner: platform-team
      - id: price-inputs-at-the-reference
        serves: "a price someone set"
        category: evidence
        outcome: "No price input is left at the reference value"
        measure: "price inputs whose value matches the reference, per reading"
        measure_note: "the record cannot tell an input set to the reference from one never set, so the measure counts the match and the review decides"
        unit: "inputs per reading"
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/cost-showback/coverage.py (the price inputs block)"
        direction: lower
        target_owner: platform-team
      - id: totals-off-their-parts
        serves: "a figure that can be defended"
        category: evidence
        outcome: "Every total equals its parts"
        measure: "totals failing the composition check within a cent, per reading"
        unit: "totals per reading"
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/cost-showback/coverage.py (the composition block)"
        direction: lower
        target_owner: platform-team
      - id: unattributed-cost-share
        serves: "every cost has an owner"
        category: cost
        outcome: "Every unit of cost is carried by a group of the declared cost-carrying tree"
        measure: "share of your estate's month-to-date cost carried by no group of the declared cost-carrying tree"
        unit: "percent of cost"
        stages: []
        paired_with: null
        instrument: {not_covered: "the companion counts the groups with a cost key and with priced members and holds no amounts by design; the instrument reads the month-to-date amounts of the union of the declared tree's members (a machine in several groups counted once) against your estate's total, which the lead builds under the strategy layer's instrument folder before step 12", lane: "64"}
        direction: lower
        target_owner: platform-team

  - id: capacity-headroom
    object_in_focus: "every cluster's capacity against the demand on it, per model and axis"
    parent: null
    outcome: "For each capacity model, the first axis of the first cluster to run out is known, graded by the governing policy's thresholds, refused when the ruler has drifted, and hardware is scheduled from it by a named owner"
    scope: platform
    accountable: platform-team
    jobs: [tuning]
    taught_by: [capacity-forecasting]
    links: []
    untaught: []
    relates_to:
      - route: tune-and-economize
        promise: "forecast per axis"
        how: derived
        reason: >-
          The capability holds the promise as a ledger: the model named on every runway, the cap screened, the
          reservations read, the ruler read and the projection gated on it, the roll-up owned, with the runway days,
          the clusters reading a real figure and the divergent ruler pairs counted, which the route states and does
          not measure.
    declarations:
      - {system: vcf-ops, system_name: "VCF Operations", object: "each cluster's ruler: the allocation ratios of each policy the declaration names, the block the parity gate compares", writer: platform-team}
      - {system: vcf-ops, system_name: "VCF Operations", object: "each cluster's ruler: the buffers and thresholds of each policy the declaration names, which no gate compares yet", writer: platform-team}
      - {system: vcenter, system_name: "vCenter", object: "the CPU and memory reservations on virtual machines (resource-pool reservations are not read)", writer: platform-team}
    drift_read: {companion: handbook/capacity-forecasting, check: "the runway per model, axis and cluster, gated on the ruler's parity, with the reservation census (runway.py)"}
    agent_entries: []
    establish:
      - id: model-named
        step: "Every runway reported with its capacity model, the model in the key's name the question asked"
        requires: []
        proven_by: "runway.py's record: the models block, each row per model"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 01: name the capacity model on every runway you report"}
      - id: cap-screened
        step: "The count at the cap printed, and the capped clusters screened rather than ranked"
        requires: [step:model-named]
        proven_by: "runway.py's record: atCap and each row's atCap per model"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 02: print the count at the cap, and screen on it rather than rank"}
      - id: reservation-census
        step: "The machines' reservations counted before the headline figure is chosen, and the plain against commitment-adjusted flavour pairs read beside the count"
        requires: []
        proven_by: "runway.py's record: the reservations block (machines, withAReservation) and the flavour pairs (pairsCompared, pairsDivergent)"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 03: run a reservation census before you choose the headline figure"}
          - {kind: taught, pages: ["/handbook/capacity-plane"], what: "[[ch:capacity-plane]]'s plate 02: a zone's reservation column beside its limit column, drawn only by a namespace that names a reservation at create; a budget the machine census does not count, read where a Supervisor runs"}
      - id: ruler-read
        step: "Each cluster's ruler read as three blocks by type, with the inherited flag"
        requires: []
        proven_by: "runway.py's record: the policies block and effectivePolicyRead"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 04: read each cluster's ruler, three blocks, by type, with the inherited flag"}
      - id: parity-gate
        step: "The projection gated on the ruler: the declared allocation ratios compared with those of the policies the declaration names, as parsed floats, refused when one differs"
        requires: [step:ruler-read]
        proven_by: "a kept run of runway.py --parity against your estate's declared rulers, passing (the gate parses the allocation block and compares floats; it writes nothing to the record, so the run's output is kept with your estate's records)"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 05: gate the projection on the ruler, compared as parsed numbers"}
      - id: rollup-owned
        step: "The first axis of the first cluster rolled up per model, and the report given an owner"
        requires: [step:cap-screened, step:parity-gate]
        proven_by: "runway.py's record for the roll-up (the record's estate block) and a dated report file naming the owner beside it"
        investment_unit: person-days
        handoff:
          - {kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 06: roll up first axis, first cluster, per model, and give the report an owner"}
    sustain:
      - {id: runway-report, loop: "Run the runway report: per model, the first axis of the first cluster, graded by the governing ruler", runner: platform-team, cadence: P1M, trigger: [schedule], toil: engineering, toil_reason: "carried by a companion; a person reads only its findings", carried_by: "deploy/privatecloudarchitect/companion/staging/handbook/capacity-forecasting/runway.py", effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 06: the report, run on the cadence"}]}
      - {id: reservation-read, loop: "Read the reservation census and choose the headline figure on it", runner: platform-team, cadence: P3M, trigger: [schedule], toil: engineering, toil_reason: "carried by a companion's census; a person chooses the headline on its reading", carried_by: "deploy/privatecloudarchitect/companion/staging/handbook/capacity-forecasting/runway.py", effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 03: the census, read each quarter"}]}
      - {id: hardware-schedule-review, loop: "Turn the runway into an order or decline it, on the record, with the report's owner", runner: platform-team, cadence: P3M, trigger: [schedule], toil: toil, toil_reason: "manual: a decision taken by people on the report, recorded by hand", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 06: the number never travels without its model, cluster and axis"}]}
      - {id: drift-read, loop: "Read the runway per model, axis and cluster, the ruler's parity and the reservations", runner: platform-team, cadence: P1W, trigger: [schedule], toil: engineering, toil_reason: "carried by a companion; a person reads only its findings", carried_by: "deploy/privatecloudarchitect/companion/staging/handbook/capacity-forecasting/runway.py", effort_unit: "person-hours per month", handoff: [{kind: taught, pages: ["/handbook/capacity-forecasting"], what: "[[ch:capacity-forecasting]]'s plate 05: the parity gate, read on the cadence"}]}
      - {id: instrument-upkeep, loop: "Keep the runway report running and check it against each release's capacity keys and policy shape", runner: platform-team, cadence: P1M, trigger: [schedule, release], toil: engineering, toil_reason: "the upkeep an automation carries as its own sustain loop (research/r2 G2)", carried_by: null, effort_unit: "person-hours per month", handoff: [{kind: untaught, what: "the strategy layer's own instruments, which no handbook page teaches", category: "the strategy layer's instrument upkeep", lane: "64", message: {sent: "2026-10-30", answer: "the strategy pages of PH4; the upkeep stays each capability's sustain loop (DEC-18)", answered: "2026-10-30"}}]}
    value:
      - id: runway-days-first-axis
        serves: "hardware bought before it runs out"
        category: resilience
        outcome: "The first axis to run out is months away"
        measure: "days until the first axis of the first cluster runs out, on the demand model"
        measure_note: "the record's estate block per model; the allocation model is read beside, and a reading of zero means your estate has run out on that model today"
        unit: "days"
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/capacity-forecasting/runway.py (the record's estate roll-up)"
        direction: higher
        target_owner: platform-team
      - id: clusters-below-the-cap
        serves: "attention where the runway is real"
        category: evidence
        outcome: "Every cluster's runway reads past the metric's horizon"
        measure: "clusters reading a real runway figure below the one-year cap on either model, screened from the capped rows, per reading"
        measure_note: "counted from the rows per model: a capped reading is a floor, not a value, so the capped rows are screened and never ranked, as the chapter teaches; the record's atCap counts the clusters capped on both models"
        unit: "clusters per reading"
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/capacity-forecasting/runway.py (the rows' atCap per model)"
        direction: lower
        target_owner: platform-team
      - id: ruler-pairs-divergent
        serves: "a projection on the declared ruler"
        category: evidence
        outcome: "The governing ruler is the declared one"
        measure: "declared allocation ratios that differ from those of the policies the declaration names, parsed as floats, per --parity run"
        unit: "ratios per run"
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/capacity-forecasting/runway.py --parity (the gate's refusal names the declared value and the one the policy holds)"
        direction: lower
        target_owner: platform-team

