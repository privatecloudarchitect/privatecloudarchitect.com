        unit: hours
        stages: []
        paired_with: null
        instrument: "deploy/privatecloudarchitect/companion/staging/handbook/platform-backup/recovery.py"
        direction: lower
        target_owner: platform-team
      - id: uncovered-plane-days
        serves: "the management plane's recovery point objective"
        category: resilience
