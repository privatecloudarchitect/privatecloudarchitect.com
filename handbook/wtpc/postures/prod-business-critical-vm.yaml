# WTPC posture record: prod-business-critical-vm (the fleet bulk)
#
# Status: PROPOSED defaults to tune on your estate. This posture's numbers
# have not been ratified; the monthly envelope review is where they move.
# Backs the starter catalog at https://privatecloudarchitect.com/handbook/wtpc
#
# Business-critical sits one tier below latency-critical: HA, DRS, and
# priority protect it, not full memory reservation.

posture: prod-business-critical-vm
sla: business-critical         # ~99.9
tier: production
archetype: traditional         # traditional server VM; not VDI, not containerized

# Membership: env AND sla. Postures keyed on more specific tags (the database,
# VDI, and Kubernetes postures) outrank this one in policy priority, so their
# members route away before this posture claims them.
membership:
  env: prod
  sla: sla-2                   # sla-2 = business-critical

groups:
  - name: "PCA - WTPC - Group - prod-business-critical-vm (VMs)"
    resource_kind: VirtualMachine
    membership: [{category: env, value: prod}, {category: sla, value: sla-2}]
  - name: "PCA - WTPC - Group - prod-business-critical-vm (Clusters)"
    resource_kind: ClusterComputeResource
    derived: ancestor-clusters-of-vms-group
  - name: "PCA - WTPC - Group - prod-business-critical-vm (Hosts)"
    resource_kind: HostSystem
    derived: parent-hosts-of-vms-group

availability_floor:
  ha: required
  ha_admission_control: enabled
  n_plus: 1
  drs_minimum: fully_automated
  anti_affinity: none          # no posture-specific rule; the database posture carries one, this does not

policy:
  name: "PCA - WTPC - Policy - prod-business-critical-vm"
  clone_from: Default
  capacity_allocation:
    cpu: 3.0                   # = cpu_overcommit.target
    memory: 1.25               # = mem_overcommit.target
    diskspace: 2.5
    poweredOffVmsConsidered: true
  capacity_buffer:
    memory_pct: 17             # 100 * (1 - 1.25/1.5)
    cpu_pct: 25                # 100 * (1 - 3.0/4.0)
  criticality: Conservative

envelope:
  capacity:
    mem_overcommit: {target: 1.25, warn: 1.5, breach: 2.0}
    cpu_overcommit: {target: 3.0,  warn: 4.0, breach: 6.0}
  performance:
    cpu_ready_pct_p95:      {target: 2.0, warn: 5.0, breach: 8.0}
    mem_contention_pct_p95: {target: 0.0, warn: 1.0, breach: 2.0}
    protection_coverage:    optional   # reservations are governed only at the strict database posture
  cost:
    reclaimable_pct: {target: 10, warn: 20, breach: 30}   # the rightsizing-yield center of gravity

notes:
  - The staging twin of this posture keeps identical targets and widens the bands roughly two times; staging rehearses production.
  - Where the bulk of a typical production fleet lands, and therefore where rightsizing yield concentrates.
