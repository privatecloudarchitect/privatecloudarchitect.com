# WTPC posture record: test-dev-traditional (the contrast anchor)
#
# Status: PROPOSED defaults to tune on your estate; instantiated live on the
# reference estate beside the exemplar, so two envelopes of opposite
# strictness judge the same shared hardware. The envelope below is the
# reference estate's running baseline (reconciled 2026-08-13), and that is
# deliberate: test-dev bands start where an estate empirically runs and are
# tightened by evidence through the envelope review. They are never de-facto
# guidance, because test-dev varies too much by environment, and they never
# carry density pressure that chokes development environments prematurely.
# Backs the starter catalog at https://privatecloudarchitect.com/handbook/wtpc
#
# The exemplar's inverse: density is the point, and sitting far UNDER the
# density target is also a failure, a cost failure, surfaced by the cost
# pillar rather than a two-sided band.

posture: test-dev-traditional
sla: best-effort               # no availability SLA; restartable only
tier: test-dev
archetype: traditional

membership:
  env: dev
  sla: sla-4                   # sla-4 = best-effort

groups:
  - name: "PCA - WTPC - Group - test-dev-traditional (VMs)"
    resource_kind: VirtualMachine
    membership: [{category: env, value: dev}, {category: sla, value: sla-4}]
  - name: "PCA - WTPC - Group - test-dev-traditional (Clusters)"
    resource_kind: ClusterComputeResource
    derived: ancestor-clusters-of-vms-group
  - name: "PCA - WTPC - Group - test-dev-traditional (Hosts)"
    resource_kind: HostSystem
    derived: parent-hosts-of-vms-group

# The floor collapses to restartability at test-dev.
availability_floor:
  ha: restartable              # restart priority only, not "required"
  ha_admission_control: disabled_acceptable
  n_plus: 0                    # no host-failure headroom guaranteed
  drs_minimum: partially_automated
  anti_affinity: none

policy:
  name: "PCA - WTPC - Policy - test-dev-traditional"
  clone_from: Default
  capacity_allocation:
    cpu: 4.0                   # high packing
    memory: 2.0                # 2:1 overcommit as the floor of normal
    diskspace: 4.0
    poweredOffVmsConsidered: false   # a powered-off dev VM does not reserve a slot
  capacity_buffer:
    memory_pct: 33             # 100 * (1 - 2.0/3.0)
    cpu_pct: 33                # 100 * (1 - 4.0/6.0)
  criticality: Aggressive      # the inverse of the exemplar's Conservative

envelope:
  capacity:
    mem_overcommit: {target: 2.0, warn: 3.0, breach: 4.0}    # density is the goal
    cpu_overcommit: {target: 4.0, warn: 6.0, breach: 8.0}    # the estate's running baseline; tighten with evidence
  performance:
    cpu_ready_pct_p95:      {target: 5.0, warn: 10.0, breach: 15.0}   # contention is expected; only pathology acts
    mem_contention_pct_p95: {target: 1.0, warn: 3.0, breach: 5.0}     # the estate's running baseline; tighten with evidence
    protection_coverage:    optional   # no reservations expected
  cost:
    reclaimable_pct: {target: 20, warn: 35, breach: 50}   # tolerated churn-slack before anyone cares

notes:
  - Under-density is the failure mode to watch here; a test-dev cluster idling at 1.0 overcommit leaves the private cloud's cost case on the table.
  - A breach here is a dashboard color, never a page.
  - Opposite envelope to the exemplar on the same metrics; posture-relativity only teaches when both judge the same glass.
