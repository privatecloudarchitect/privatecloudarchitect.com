# =============================================================================
# Template 5, part 2 - the microservices, applied INTO the VKS cluster
# =============================================================================
# A deliberately small microservices application: a frontend, a backend API, and a
# cache. Enough to show the pattern without the noise of a large system. You apply
# this with kubectl (or GitOps) against the VKS cluster from the blueprint.
#
# The pattern to take from it:
#   * each service is its own Deployment, scaled and released independently
#   * services find each other by Kubernetes DNS (name.namespace.svc.cluster.local),
#     so nothing hardcodes an address
#   * one service, the frontend, is exposed outside through a LoadBalancer; the rest
#     are cluster-internal (ClusterIP) and never directly reachable from outside
#
# Replace the frontend and backend images with your own services; the cache uses a
# real Redis image so the example runs as-is. For a fuller reference at scale, the
# Google "Online Boutique" sample demonstrates the same shape across a dozen services.
# =============================================================================
---
# FRONTEND - the only service exposed to the outside world.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_YOUR_FRONTEND_IMAGE
          ports:
            - containerPort: 8080
          env:
            # The frontend calls the backend by its cluster DNS name, never an IP.
            # Kubernetes resolves `backend` to the backend Service below.
            - name: BACKEND_URL
              value: "http://backend:80"
---
# The frontend's external front door: a LoadBalancer Service, fulfilled by NSX
# Advanced Load Balancer on VKS. This is the same front-door idea as every earlier
# template, expressed in Kubernetes.
apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: 8080
---
# BACKEND - an internal API service. ClusterIP (the default), so it is reachable only
# from inside the cluster, by the name `backend`. It reads and writes the cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: REPLACE_WITH_YOUR_BACKEND_IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: CACHE_HOST
              value: "cache"          # the cache Service name, resolved by cluster DNS
            - name: CACHE_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - port: 80
      targetPort: 8080
---
# CACHE - a real Redis, so this file runs without you supplying an image. One replica
# is right for a cache in a demo; a production cache is a managed service or a proper
# clustered deployment, not a single Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  selector:
    app.kubernetes.io/component: cache
  ports:
    - port: 6379
      targetPort: 6379
