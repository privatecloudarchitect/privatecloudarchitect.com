# =============================================================================
# Template 4 (WALK -> RUN) - A hybrid application: a VM database + a container tier
# =============================================================================
# Every template so far used virtual machines only. Real applications are rarely
# all one kind of thing. This one is the hybrid: a PostgreSQL database on a VM, and
# a web/app tier running as containers on a Kubernetes cluster, living together in
# ONE Supervisor namespace under one governance boundary.
#
# This is the pattern that a Supervisor namespace makes possible: a virtual machine
# and a Kubernetes cluster are peers in the same tenancy, not two separate worlds
# you stitch together across a boundary. Stateful workloads that are happiest on a
# VM (a database) sit beside stateless workloads that are happiest in containers
# (web and app tiers), and they share one network, one quota, one policy.
#
# What this blueprint provisions (the INFRASTRUCTURE):
#   * a PostgreSQL VM (VM Service), configured by cloud-init - templates 1 and 2
#   * a VKS guest cluster (a full Kubernetes cluster: 1 control plane + N workers)
#
# What you deploy INTO the VKS cluster afterward (the APPLICATION):
#   * app-and-web.k8s.yaml - the web and app container tiers, plus their front door
#
# The split is intentional and matches how these run in practice: the blueprint
# stands up the platform, then the application is applied into the cluster with
# kubectl or GitOps. The README walks the full sequence.
# =============================================================================

name: hybrid-3tier
version: 1.0.0
formatVersion: 2

description: |
  A hybrid three-tier application on VCF: a PostgreSQL database on a VM, and a
  containerized web and app tier on a VKS Kubernetes cluster, in one Supervisor
  namespace. The point where a virtual machine and Kubernetes stop being separate
  worlds.

inputs:

  app_name:
    type: string
    title: Application name
    pattern: '^[a-z][a-z0-9-]{2,40}$'
    default: storefront

  environment:
    type: string
    title: Environment
    enum: [dev, staging, prod, demo, sandbox]
    default: demo

  target_namespace_name:
    type: string
    title: Target Supervisor namespace
    description: 'Vended to you by your platform team.  kubectl get supervisornamespaces'
    pattern: '^[a-z][a-z0-9-]+$'

  region:
    type: string
    title: Region
    description: 'kubectl get regions'

  # --- Database VM sizing/image (the stateful tier) --------------------------
  db_vm_image:
    type: string
    title: Database VM image (immutable ID)
    description: 'kubectl get clustervirtualmachineimages | grep -i ubuntu'

  db_vm_class:
    type: string
    title: Database VM class
    description: >-
      A database benefits from reserved resources. Prefer a guaranteed-* class in
      production so the DB is not starved under contention.  kubectl get virtualmachineclasses
    default: best-effort-small

  db_storage_class:
    type: string
    title: Database storage class
    description: 'kubectl get storageclasses'

  db_boot_disk_capacity:
    type: string
    title: Database boot disk capacity
    default: 20Gi

  db_password:
    type: string
    title: Database password
    description: >-
      Password for the application database user cloud-init creates. Encrypted at
      rest by the platform. Lab/demo default only; source it from a secrets manager
      for anything real. Referenced only inside cloud-init, never emitted.
    encrypted: true
    default: change-me-on-first-use

  # --- VKS guest cluster (the container platform for the stateless tiers) -----
  kubernetes_release:
    type: string
    title: Kubernetes release (TKR)
    description: >-
      The Tanzu Kubernetes Release label that pins the cluster version and its node
      OS image. List what your platform offers:  kubectl get tanzukubernetesreleases
    default: v1.31.4---vmware.1-fips-vkr.1

  kubernetes_version:
    type: string
    title: Kubernetes version
    description: 'The version the TKR resolves to (matches the release above).'
    default: v1.31.4+vmware.1-fips.1

  vks_class:
    type: string
    title: VKS node VM class
    description: 'The VM class each Kubernetes node runs as.  kubectl get virtualmachineclasses'
    default: best-effort-small

  vks_storage_class:
    type: string
    title: VKS node storage class
    description: 'Storage class for the Kubernetes node VMs.  kubectl get storageclasses'

  vks_worker_replicas:
    type: integer
    title: VKS worker count
    description: 'How many worker nodes. Two is a sensible small default; raise for capacity.'
    default: 2
    minimum: 1
    maximum: 5

# -----------------------------------------------------------------------------
# RESOURCES
# -----------------------------------------------------------------------------
resources:

  Namespace:
    type: CCI.Supervisor.Namespace
    properties:
      existing: true
      name: ${input.target_namespace_name}

  # The database's cloud-init: install PostgreSQL, create the app database and a
  # user, and listen on the namespace network so the container tier can reach it.
  # Same cloud-init mechanism as template 2, doing database setup instead of nginx.
  DbBootstrap:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${input.app_name}-db-01-bootstrap
        type: Opaque
        stringData:
          user-data: |
            #cloud-config
            hostname: ${input.app_name}-db-01
            bootcmd:
              - systemctl stop unattended-upgrades 2>/dev/null || true
              - systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
            packages:
              - chrony
              - postgresql
            runcmd:
              - systemctl enable --now chrony
              - systemctl enable --now postgresql
              # Create the application database and user. In production, manage schema
              # with migrations rather than inline SQL; this is the day-0 minimum.
              - |
                sudo -u postgres psql <<SQL
                CREATE DATABASE ${input.app_name};
                CREATE USER appuser WITH ENCRYPTED PASSWORD '${input.db_password}';
                GRANT ALL PRIVILEGES ON DATABASE ${input.app_name} TO appuser;
                SQL
              # Listen beyond localhost and allow the namespace network to connect,
              # so the container tier can reach the database. Scope pg_hba to your
              # VPC CIDR in production rather than opening it broadly.
              - sed -i "s/^#listen_addresses.*/listen_addresses = '*'/" /etc/postgresql/*/main/postgresql.conf
              - bash -c "echo 'host all all 0.0.0.0/0 scram-sha-256' >> /etc/postgresql/*/main/pg_hba.conf"
              - systemctl restart postgresql

  # 1) The DATABASE, on a VM (the stateful tier) ------------------------------
  # A plain VM Service VirtualMachine, exactly as in templates 1-3. A database is a
  # good fit for a VM: it wants stable storage, predictable resources, and a long
  # life, which is what a VM gives it.
  PostgresVM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - DbBootstrap
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${input.app_name}-db-01
          labels:
            app.kubernetes.io/name: ${input.app_name}-db-01
            app.kubernetes.io/component: database
            app.kubernetes.io/part-of: ${input.app_name}
        spec:
          className: ${input.db_vm_class}
          imageName: ${input.db_vm_image}
          storageClass: ${input.db_storage_class}
          bootDiskCapacity: ${input.db_boot_disk_capacity}
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: ${input.app_name}-db-01-bootstrap
                key: user-data

  # 2) The CONTAINER PLATFORM: a VKS guest cluster (the stateless tiers' home) --
  # This one resource asks the Supervisor for a full, conformant Kubernetes cluster:
  # its own control plane and worker nodes (each node is itself a VM the platform
  # manages for you). Your web and app containers run here. It sits in the SAME
  # namespace as the database VM, on the same VPC network, which is what lets a Pod
  # in this cluster reach the database VM directly.
  #
  # The manifest is a Cluster API (CAPI) object. You do not hand-build node specs;
  # you name a cluster class the platform publishes and set a few knobs (version,
  # control-plane and worker counts, node size, CNI). The platform reconciles the
  # rest.
  VksCluster:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: cluster.x-k8s.io/v1beta2
        kind: Cluster
        metadata:
          name: ${input.app_name}-${input.environment}-vks
          labels:
            run.tanzu.vmware.com/tkr: ${input.kubernetes_release}
            app.kubernetes.io/part-of: ${input.app_name}
            app.kubernetes.io/component: vks-host
        spec:
          # The cluster's internal address ranges. These are cluster-private; keep
          # them from overlapping other clusters that share routing with this one.
          clusterNetwork:
            pods:
              cidrBlocks:
                - 192.168.192.0/20
            services:
              cidrBlocks:
                - 10.96.0.0/12
            serviceDomain: cluster.local
          topology:
            # A platform-published cluster class. You consume it; you do not author
            # the node internals. Confirm the classes available to you with:
            #   kubectl get clusterclasses -n vmware-system-vks-public
            classRef:
              name: builtin-generic-v3.6.0
              namespace: vmware-system-vks-public
            version: ${input.kubernetes_version}
            controlPlane:
              replicas: 1                          # one CP for a lab; three for HA in prod
            workers:
              machineDeployments:
                - class: node-pool
                  name: workers
                  replicas: ${input.vks_worker_replicas}
            variables:
              - name: vmClass
                value: ${input.vks_class}
              - name: storageClass
                value: ${input.vks_storage_class}
              - name: bootstrapAddons
                value:
                  cniRef:
                    name: antrea
                    namespace: vmware-system-vks-public

# -----------------------------------------------------------------------------
# OUTPUTS
# -----------------------------------------------------------------------------
outputs:

  namespace_name:
    description: The Supervisor namespace holding both the database VM and the VKS cluster.
    value: ${resource.Namespace.name}

  database_vm:
    description: The PostgreSQL VM. The container tier connects to this VM's namespace IP on 5432.
    value: ${input.app_name}-db-01

  vks_cluster:
    description: The Kubernetes cluster the web and app tiers run on.
    value: ${input.app_name}-${input.environment}-vks

  next_steps:
    description: >-
      The infrastructure is up. Now deploy the application INTO the cluster: get a
      kubeconfig for the VKS cluster, read the database VM's IP, then apply
      app-and-web.k8s.yaml with that IP. Full sequence in this template's README.
    value: 'see README: kubeconfig -> db IP -> kubectl apply -f app-and-web.k8s.yaml'
