# =============================================================================
# Template V02 (VM APPS, CRAWL) - A machine that configures itself (cloud-init)
# =============================================================================
# Stage 02's lesson in the VM Apps dialect: on its first boot the machine runs a
# bootstrap you supply. It creates a login, installs nginx and serves a page that
# names the host, so it comes up already doing its job.
#
# Read stage 02 first (../../templates/02-vm-cloud-init/): cloud-init, its
# once-per-instance behavior and the unattended-upgrades lock are taught there.
# What is new since V01, and nothing else:
#   * one new property on the machine: cloudConfig, a #cloud-config document as
#     in stage 02. Here it is a property of the machine, not a Secret; VCF
#     Automation hands it to the guest's cloud-init at first boot.
#   * two new inputs: the login's name and its password.
#   * changes to stage 02's document: the install and the page are a script
#     cloud-init runs at every boot until it has finished once, because on VM
#     Apps the first boot can be cut short by a reboot (the comment at
#     write_files says why, and G-988 is the record); ssh_pwauth: true, so the
#     password login works over SSH; no hostname: line, since VCF Automation names
#     the machine; and no chrony, which the lesson does not need.
#
# What differs from stage 02 beyond the dialect: the machine sits on a network your
# administrator routes, not a namespace's private one, so where your workstation can
# reach that network you read the page at the machine's own address. The proof's
# workstation could not, and read it from a machine on the same network.
# =============================================================================

name: vmapps-vm-cloud-init
version: 1.0.0
formatVersion: 2

description: |
  One Ubuntu machine that configures itself on first boot with cloud-init: a login,
  nginx, and a page that names the host. The VM Apps form of stage 02.

inputs:

  # --- Unchanged from V01 ----------------------------------------------------
  app_name:
    type: string
    title: Application name
    pattern: '^[a-z][a-z0-9-]{2,30}$'
    default: hello-web

  image:
    type: string
    title: Image mapping
    description: 'An Ubuntu 24.04 image mapping.  GET /iaas/api/images'

  flavor:
    type: string
    title: Flavor mapping (size)
    description: 'GET /iaas/api/flavors'

  network_tag:
    type: string
    title: Network constraint tag
    description: 'A network profile''s tag, key:value.  GET /iaas/api/network-profiles'
    pattern: '^[^:\s]+:[^\s]+$'

  ip_assignment:
    type: string
    title: Address assignment
    enum: [static, dynamic]
    default: static

  # --- New in V02 ------------------------------------------------------------
  admin_username:
    type: string
    title: Admin username
    description: >-
      The login cloud-init creates, with passwordless sudo. Named for its function,
      not a person, and not a bare word an image may already use as a group name
      (operator, admin, users, staff): Ubuntu refuses a user named like a group.
    pattern: '^[a-z_][a-z0-9_-]{1,30}$'
    default: appadmin

  admin_password:
    type: string
    title: Admin password
    description: >-
      Password for the admin login. Marked encrypted so the platform stores it as a
      secret and the request form masks it. For anything real, prefer an SSH key
      and source the credential from your secrets manager.
    encrypted: true

resources:

  Network:
    type: Cloud.NSX.Network
    properties:
      networkType: existing
      constraints:
        - tag: ${input.network_tag}

  VM:
    type: Cloud.vSphere.Machine
    properties:
      name: ${input.app_name}
      image: ${input.image}
      flavor: ${input.flavor}
      networks:
        - network: ${resource.Network.id}
          assignment: ${input.ip_assignment}
      # NEW: the bootstrap. The #cloud-config first line is required. The login is
      # stage 02's users and chpasswd, line for line; the header lists the changes.
      cloudConfig: |
        #cloud-config
        users:
          - default
          - name: ${input.admin_username}
            groups: [sudo]
            sudo: ALL=(ALL) NOPASSWD:ALL
            lock_passwd: false
            shell: /bin/bash
        chpasswd:
          users:
            - name: ${input.admin_username}
              password: ${input.admin_password}
              type: text
          expire: false
        ssh_pwauth: true
        # The setup is a script cloud-init runs at EVERY boot until it has finished once,
        # not stage 02's packages: and runcmd:. On VM Apps, vSphere's guest customization
        # runs beside cloud-init on first boot and can reboot the machine while cloud-init
        # is still installing; cloud-init never runs a once-per-instance module again once
        # it has started it, so a package install cut off by that reboot never comes back
        # (G-988). A per-boot script with a
        # done marker finishes on whichever boot reaches its end, and does nothing after.
        write_files:
          - path: /var/lib/cloud/scripts/per-boot/10-web-setup.sh
            permissions: '0755'
            content: |
              #!/bin/bash
              set -euo pipefail
              [ -f /var/lib/web-setup.done ] && exit 0
              export DEBIAN_FRONTEND=noninteractive
              systemctl stop unattended-upgrades apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
              dpkg --configure -a || true        # finish an install a reboot interrupted
              # Bounded waits: apt's own default can wait on a stalled mirror for good.
              apt_get() { apt-get -o DPkg::Lock::Timeout=300 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 "$@"; }
              retry() { local n=1; until "$@"; do [ "$n" -ge 6 ] && return 1; n=$((n+1)); sleep 30; done; }
              retry apt_get update
              retry apt_get install -y nginx
              cat > /var/www/html/index.html <<HTML
              <!doctype html><html><body style="font-family:sans-serif;margin:3em">
              <h1>${input.app_name}</h1>
              <p>Configured by cloud-init on host <strong>$(hostname)</strong>, deployed through VCF Automation VM Apps.</p>
              </body></html>
              HTML
              systemctl enable nginx
              systemctl restart nginx
              touch /var/lib/web-setup.done

outputs:

  vm_name:
    description: The machine's name in vCenter.
    value: ${resource.VM.resourceName}

  see_the_page:
    description: >-
      The page cloud-init wrote, at the machine's own address. A network your
      workstation cannot route to needs a jump host instead.
    value: http://${resource.VM.address}/

  admin_user:
    description: >-
      The login cloud-init created (passwordless sudo). Its password came from the
      admin_password input and is not repeated here.
    value: ${input.admin_username}
