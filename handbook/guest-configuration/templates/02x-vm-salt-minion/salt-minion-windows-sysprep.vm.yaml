# =============================================================================
# Template 02x-d (EXTRA CREDIT) - salt-minion-win, a Windows minion through Sysprep
# =============================================================================
# The Windows bootstrap that completed on the stock Windows Server 2022 image the proof runs
# used, and the companion's default:
# the VM Service's Sysprep provider with a raw unattend answer file. VM Operator fills the
# {{ V1alpha5_... }} values with the machine's own network when it customizes the guest;
# leave them as they are. The first logon downloads the pinned Salt 3008.5 installer from
# Broadcom's package location and runs Salt's documented silent install with the master's
# address and this minion's id.
#
# Two fields follow Microsoft's unattend reference rather than the VM Operator page's
# example: each DNS server's address is the IpAddress element's value with an index as its
# key, and the default route's Prefix is 0.0.0.0/0.
#
# The machine's name is its Windows host name, so keep it to 15 characters: on this path
# VM Operator refuses a longer one.
#
# The administrator password is in the Secret in plain text, as Sysprep takes it: generate
# one for this machine and keep the Secret's access as tight as the password's. The first
# logon signs Administrator on once to run the install (Order 1), and the second first-logon
# command (Order 2) signs that session out with shutdown.exe /l. Microsoft's page for Order
# says these commands "are now started at the same time, and no longer wait for the previous
# command to finish", so the sign-out does not trust its Order: it waits until the salt-minion
# service runs and the installer has exited, 60 minutes at most, and then signs out.
#
# Afterwards, accept the key on the master by exact id, never with salt-key -A. To compare
# the key itself first, out of band, you need a way into the master and this minion that
# is not Salt: the master's template carries no login (add stage 02's operator user, with
# sudo), and here the Administrator password you give is the login. How to reach a VM
# Service machine's console on 9.1.1 is not established here, and no run of the companion
# compared by hand. Then:
#   sudo salt-key -p salt-minion-win    (on the master: the pending public key)
#   type "C:\ProgramData\Salt Project\Salt\conf\pki\minion\minion.pub"
#                                       (on the minion, as Administrator: its own key)
#   sudo salt-key -a salt-minion-win    (only when the lines between BEGIN and END match)
# Do not compare salt-key -f with salt-call --local key.finger on Salt 3008.5: the master
# hashes the whole PEM it holds and the minion only the lines inside it, so the two
# fingerprints differ for the same key. No key generated on the master is seeded on
# this path, the companion's choice: one first-logon CommandLine holds at most 1024
# characters, a PEM private key is longer, and splitting it across commands was neither
# built nor run.
#
# Before you apply it: fill the <REPLACE_ME-...> values.
# Salt 3008 LTS from Broadcom's package location: Salt Project, the free path; the chapter
# quotes its support terms.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: salt-minion-win-bootstrap
  labels:
    app: salt-minion-win-bootstrap
    app.kubernetes.io/name: salt-minion-win-bootstrap
    app.kubernetes.io/component: salt-minion
    app.kubernetes.io/part-of: guest-configuration
type: Opaque
stringData:
  unattend: |
    <?xml version="1.0" encoding="UTF-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend">
      <settings pass="specialize">
        <component name="Microsoft-Windows-TCPIP" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <Interfaces>
            <Interface wcm:action="add">
              <Ipv4Settings>
                <DhcpEnabled>false</DhcpEnabled>
              </Ipv4Settings>
              <Ipv6Settings>
                <DhcpEnabled>false</DhcpEnabled>
              </Ipv6Settings>
              <Identifier>{{ V1alpha5_FirstNicMacAddr }}</Identifier>
              <UnicastIpAddresses>
                <IpAddress wcm:action="add" wcm:keyValue="1">{{ V1alpha5_FirstIP }}</IpAddress>
              </UnicastIpAddresses>
              <Routes>
                <Route wcm:action="add">
                  <Identifier>0</Identifier>
                  <Metric>10</Metric>
                  <NextHopAddress>{{ (index .V1alpha5.Net.Devices 0).Gateway4 }}</NextHopAddress>
                  <Prefix>0.0.0.0/0</Prefix>
                </Route>
              </Routes>
            </Interface>
          </Interfaces>
        </component>
        <component name="Microsoft-Windows-DNS-Client" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <Interfaces>
            <Interface wcm:action="add">
              <Identifier>{{ V1alpha5_FirstNicMacAddr }}</Identifier>
              <DNSServerSearchOrder>
                <IpAddress wcm:action="add" wcm:keyValue="1">{{ index .V1alpha5.Net.Nameservers 0 }}</IpAddress>
                {{ if gt (len .V1alpha5.Net.Nameservers) 1 }}<IpAddress wcm:action="add" wcm:keyValue="2">{{ index .V1alpha5.Net.Nameservers 1 }}</IpAddress>{{ end }}
              </DNSServerSearchOrder>
            </Interface>
          </Interfaces>
        </component>
        <component name="Microsoft-Windows-Deployment" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <RunSynchronous>
            <RunSynchronousCommand wcm:action="add">
              <Path>C:\sysprep\guestcustutil.exe restoreMountedDevices</Path>
              <Order>1</Order>
            </RunSynchronousCommand>
            <RunSynchronousCommand wcm:action="add">
              <Path>C:\sysprep\guestcustutil.exe flagComplete</Path>
              <Order>2</Order>
            </RunSynchronousCommand>
            <RunSynchronousCommand wcm:action="add">
              <Path>C:\sysprep\guestcustutil.exe deleteContainingFolder</Path>
              <Order>3</Order>
            </RunSynchronousCommand>
          </RunSynchronous>
        </component>
      </settings>
      <settings pass="oobeSystem">
        <component name="Microsoft-Windows-International-Core" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <InputLocale>0409:00000409</InputLocale>
          <SystemLocale>en-US</SystemLocale>
          <UserLocale>en-US</UserLocale>
          <UILanguage>en-US</UILanguage>
        </component>
        <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <OOBE>
            <HideEULAPage>true</HideEULAPage>
            <HideLocalAccountScreen>true</HideLocalAccountScreen>
            <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
            <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
            <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
            <ProtectYourPC>3</ProtectYourPC>
            <SkipMachineOOBE>true</SkipMachineOOBE>
            <SkipUserOOBE>true</SkipUserOOBE>
          </OOBE>
          <TimeZone>UTC</TimeZone>
          <UserAccounts>
            <AdministratorPassword>
              <Value>&lt;REPLACE_ME-administrator-password&gt;</Value>
              <PlainText>true</PlainText>
            </AdministratorPassword>
          </UserAccounts>
          <AutoLogon>
            <Enabled>true</Enabled>
            <Username>Administrator</Username>
            <LogonCount>1</LogonCount>
            <Password>
              <Value>&lt;REPLACE_ME-administrator-password&gt;</Value>
              <PlainText>true</PlainText>
            </Password>
          </AutoLogon>
          <FirstLogonCommands>
            <SynchronousCommand wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <Order>1</Order>
              <Description>Install the Salt minion</Description>
              <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ProgressPreference='SilentlyContinue'; $ErrorActionPreference='Stop'; $url='https://packages.broadcom.com/artifactory/saltproject-generic/windows/3008.5/Salt-Minion-3008.5-Py3-AMD64-Setup.exe'; $exe=Join-Path $env:TEMP 'Salt-Minion-Setup.exe'; for($i=1;$i -le 10;$i++){ try { [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12; Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $exe; break } catch { if($i -eq 10){ throw }; Start-Sleep -Seconds 30 } }; Start-Process -FilePath $exe -ArgumentList '/S','/master=&lt;REPLACE_ME-master-ip&gt;','/minion-name=salt-minion-win' -Wait"</CommandLine>
            </SynchronousCommand>
            <SynchronousCommand wcm:action="add" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
              <Order>2</Order>
              <Description>Sign the first logon out once the install has finished</Description>
              <CommandLine>powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$deadline=(Get-Date).AddMinutes(60); while((Get-Date) -lt $deadline){ $svc=Get-Service salt-minion -ErrorAction SilentlyContinue; $setup=Get-Process Salt-Minion-Setup -ErrorAction SilentlyContinue; if($svc -and $svc.Status -eq 'Running' -and -not $setup){ break }; Start-Sleep -Seconds 10 }; shutdown.exe /l"</CommandLine>
            </SynchronousCommand>
          </FirstLogonCommands>
        </component>
      </settings>
    </unattend>
---
apiVersion: vmoperator.vmware.com/v1alpha5
kind: VirtualMachine
metadata:
  name: salt-minion-win
  labels:
    app: salt-minion-win
    app.kubernetes.io/name: salt-minion-win
    app.kubernetes.io/component: salt-minion
    app.kubernetes.io/part-of: guest-configuration
spec:
  className: best-effort-medium
  imageName: <REPLACE_ME-windows-2022-image>
  storageClass: <REPLACE_ME-storage-class>
  powerState: PoweredOn
  bootstrap:
    sysprep:
      rawSysprep:
        name: salt-minion-win-bootstrap
        key: unattend
