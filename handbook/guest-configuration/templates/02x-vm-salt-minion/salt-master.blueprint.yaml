# =============================================================================
# Template 02x-a as a blueprint (EXTRA CREDIT) - salt-master, a Salt master
# through VCF Automation
# =============================================================================
# salt-master.vm.yaml beside this file, as a VCF Automation blueprint in stage 02's
# shape: the same Secret, VirtualMachine and VirtualMachineService, each a
# CCI.Supervisor.Resource in a namespace you already have. guestcfg.py creates this
# blueprint in your project from this file as written (GUESTCFG_VIA=automation),
# validates it and deploys it, and a test holds the Secret and the manifests below to
# what the script renders.
#
# A Salt master is a platform service an estate runs once, and workloads join it for
# years. So the master is a blueprint of its own, and each minion blueprint takes the
# master's address as an input (salt-minion-linux.blueprint.yaml and
# salt-minion-windows-sysprep.blueprint.yaml). Why an input and not a reference to
# this deployment: the master exists before any workload that joins it, as a deployment
# of its own, and a guest that read the master's address at boot would need a token in
# the guest.
#
# The API account's grant names the two minion ids given as inputs. A master that minions
# join for years grows that grant by editing its configuration as each one joins, which no
# run of the companion exercised. No login is set on the master: add stage 02's operator
# user, with sudo, if you mean to run salt-key on it by hand.
#
# What is new beside salt-master.vm.yaml, and nothing else:
#   * the API account's digest line, the API's certificate and its key arrive as
#     inputs, each ONE line of base64 that cloud-init decodes (write_files with
#     encoding: b64). A multi-line value substituted into the cloud-config below would
#     have to match its indentation; one line of base64 cannot break it.
#   * the two minion ids the API may reach, and the source ranges set on the API's load
#     balancer (loadBalancerSourceRanges), are inputs. The ranges reach the object as
#     given; whether your load balancer enforces them is your provider's to decide, so
#     prove it (guestcfg.py, GUESTCFG_PROVE_SOURCE_RANGES=1) and limit port 8000 at your
#     network's edge.
#   * every object carries app.kubernetes.io/managed-by: vcf-automation, and your run
#     label when you give one. Remove a deployment through VCF Automation (Delete on
#     the deployment), never its objects underneath it.
#
# Before you request it, make the three encoded inputs, each one line:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj /CN=salt-master \
#     -keyout api.key -out api.crt
#   openssl base64 -A -in api.crt          # api_tls_cert_b64
#   openssl base64 -A -in api.key          # api_tls_key_b64
#   printf 'guestcfg-api:%s\n' "$(printf '%s' "$PASSWORD" | sha256sum | cut -d' ' -f1)" \
#     | openssl base64 -A                  # api_digest_b64, from the API password you choose
# Once the deployment is CREATE_SUCCESSFUL, read the master's address with the command
# in its outputs and give it to each minion blueprint as salt_master_address.
# Success: https://<API address>:8000/login accepts guestcfg-api and your password
# (Salt's file eauth) over TLS.
# Salt 3008 LTS from Broadcom's package location: Salt Project, the free path; the
# chapter quotes its support terms.
# =============================================================================

name: salt-master
version: 1.0.0
formatVersion: 2

description: |
  An independent Salt master (Salt Project 3008 LTS) on Ubuntu 24.04 in a Supervisor
  namespace you already have, its API over TLS behind one load balancer on port 8000.
  Minions join it through their own blueprints, given its address.

inputs:

  # --- As in stage 02 ----------------------------------------------------------
  app_name:
    type: string
    title: Name
    description: >-
      Lowercase kebab-case slug every object's name derives from: <app_name>-master
      (the machine, its host name, and the deployment guestcfg.py names),
      <app_name>-master-bootstrap and <app_name>-api.
    pattern: '^[a-z][a-z0-9-]{2,40}$'
    default: salt

  target_namespace_name:
    type: string
    title: Target Supervisor namespace
    description: >-
      The Supervisor namespace to deploy into, vended to you by your platform team.
      Discover with:  kubectl get supervisornamespaces
    pattern: '^[a-z][a-z0-9-]+$'

  vm_image:
    type: string
    title: Ubuntu 24.04 image (display name)
    description: >-
      The image's display name, not its vmi- id, which a rebuilt library changes.
        kubectl get clustervirtualmachineimages,virtualmachineimages -o custom-columns=ID:.metadata.name,NAME:.status.name

  storage_class:
    type: string
    title: Storage class
    description: 'Where the boot disk lives.  kubectl get regionstorageclassquotas'

  vm_class:
    type: string
    title: VM class (size)
    description: 'The governed size class.  kubectl get virtualmachineclasses'
    default: best-effort-small

  # --- New for the master --------------------------------------------------------
  run_label:
    type: string
    title: Run label (optional)
    description: >-
      Written as the label handbook-guestcfg-run on every object, so one run's objects
      stay findable by label:  kubectl get secret,virtualmachine,virtualmachineservice
      -l handbook-guestcfg-run=<label>. guestcfg.py sets its run id here. Empty, the
      label is present with no value.
    pattern: '^([a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)?$'
    default: ''

  linux_minion_id:
    type: string
    title: Linux minion id
    description: >-
      The Linux minion the API account may reach: its machine name, which is also its
      minion id (<app_name>-linux in salt-minion-linux.blueprint.yaml).
    pattern: '^[a-z][a-z0-9-]{1,62}$'

  windows_minion_id:
    type: string
    title: Windows minion id
    description: >-
      The Windows minion the API account may reach: its machine name, at most 15
      characters (<app_name>-win in salt-minion-windows-sysprep.blueprint.yaml).
    pattern: '^[a-z][a-z0-9-]{1,14}$'

  api_digest_b64:
    type: string
    title: API account digest line (base64)
    description: >-
      One line of base64 of the line guestcfg-api:<SHA-256 of the API password>,
      ending in a newline (the header shows the command). Salt's file eauth reads it
      with ^hashtype sha256; the guest never receives the password itself. Marked
      encrypted, so the platform stores it as a secret and the request form masks it.
    encrypted: true

  api_tls_cert_b64:
    type: string
    title: API TLS certificate (base64)
    description: >-
      One line of base64 of the API's PEM certificate:  openssl base64 -A -in api.crt.
      A certificate is public, so it is not encrypted; a client pins it to trust the
      API.
    pattern: '^[A-Za-z0-9+/]+={0,2}$'

  api_tls_key_b64:
    type: string
    title: API TLS private key (base64)
    description: >-
      One line of base64 of the API's PEM private key:  openssl base64 -A -in api.key.
      Marked encrypted; it is referenced only where cloud-init writes it, never echoed
      back in an output.
    encrypted: true

  api_source_ranges:
    type: array
    title: Addresses that may reach the API (CIDRs)
    description: >-
      The load balancer's loadBalancerSourceRanges, such as ["203.0.113.0/24"]. VM
      Operator's v1alpha5 reference says of the field "This field will be ignored if
      the provider does not support the feature.", so prove your load balancer's
      behavior before you rely on it. ["0.0.0.0/0"] leaves the API open to any source
      that reaches the load balancer.
    items:
      type: string

# -----------------------------------------------------------------------------
# RESOURCES
# -----------------------------------------------------------------------------
resources:

  # As in stage 02: reference the namespace you were vended.
  Namespace:
    type: CCI.Supervisor.Namespace
    properties:
      existing: true
      name: ${input.target_namespace_name}

  # The master's first boot, carried in a Secret as in stage 02: Salt 3008 LTS from
  # Broadcom's package location, the master's configuration, the API's digest,
  # certificate and key, the states the proof run applies, and the install script.
  Bootstrap:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${input.app_name}-master-bootstrap
          labels:
            app: ${input.app_name}-master-bootstrap
            app.kubernetes.io/name: ${input.app_name}-master-bootstrap
            app.kubernetes.io/component: salt-master
            app.kubernetes.io/part-of: guest-configuration
            app.kubernetes.io/managed-by: vcf-automation
            handbook-guestcfg-run: '${input.run_label}'
        type: Opaque
        stringData:
          user-data: |
            #cloud-config
            hostname: ${input.app_name}-master
            bootcmd:
              - systemctl stop unattended-upgrades 2>/dev/null || true
              - systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
            packages:
              - ca-certificates
              - curl
              - gnupg
            write_files:
              # The Salt Project's apt source, as its install guide publishes it, so the guest needs
              # only Broadcom's package location. Moved into place by install.sh after the signing key.
              - path: /opt/guestcfg/salt.sources
                permissions: '0644'
                content: |
                  X-Repolib-Name: Salt Project
                  Enabled: yes
                  Types: deb
                  URIs: https://packages.broadcom.com/artifactory/saltproject-deb
                  Signed-By: /etc/apt/keyrings/salt-archive-keyring.pgp
                  Suites: stable
                  Components: main
              # Holds this guest to the 3008 LTS line through apt, the pin Salt's install guide gives.
              - path: /opt/guestcfg/salt-pin
                permissions: '0644'
                content: |
                  Package: salt-*
                  Pin: version 3008.*
                  Pin-Priority: 1001
              # The master's configuration. auto_accept and open_mode are written at their defaults so
              # a reader sees them. The API account may call exactly the functions the proof run calls,
              # on exactly the two minion ids the inputs name (key.print and key.finger are the probe's
              # reads of what the master holds).
              # The API runs TLS with the certificate below.
              - path: /opt/guestcfg/master.conf
                permissions: '0600'
                content: |
                  auto_accept: False
                  open_mode: False
                  file_roots:
                    base:
                      - /srv/salt
                  netapi_enable_clients:
                    - local_async
                    - runner
                    - wheel
                  rest_cherrypy:
                    port: 8000
                    ssl_crt: /etc/salt/guestcfg/api.crt
                    ssl_key: /etc/salt/guestcfg/api.key
                  external_auth:
                    file:
                      ^filename: /etc/salt/guestcfg/api.digest
                      ^hashtype: sha256
                      guestcfg-api:
                        - 'L@${input.linux_minion_id},${input.windows_minion_id}':
                            - test.ping
                            - grains.item
                            - state.apply
                        - '@wheel':
                            - key.list_all
                            - key.accept
                            - key.delete
                            - key.finger
                            - key.print
                        - '@runner':
                            - jobs.lookup_jid
              # The three values that arrive as inputs, each ONE line of base64 that write_files decodes
              # (encoding: b64): the API account's digest line, the API's certificate, and its key. A
              # multi-line value substituted here would have to match this document's indentation; one
              # line of base64 cannot break it. The key's permissions are tightened by install.sh once the
              # salt user exists.
              - path: /opt/guestcfg/api.digest
                permissions: '0600'
                encoding: b64
                content: '${input.api_digest_b64}'
              - path: /opt/guestcfg/api.crt
                permissions: '0644'
                encoding: b64
                content: '${input.api_tls_cert_b64}'
              - path: /opt/guestcfg/api.key
                permissions: '0600'
                encoding: b64
                content: '${input.api_tls_key_b64}'
              # The state the proof run applies: one managed file, the same state for Linux and Windows,
              # then the state that makes the drift, and the read-only probes. Add your own under /srv/salt.
              - path: /srv/salt/guestcfg/init.sls
                permissions: '0644'
                content: |
                  # The baseline: one managed file, the same state on Linux and on Windows. The first apply
                  # creates it, the next finds it correct and changes nothing, and an apply after a local
                  # change puts it back. Only the path depends on the operating system.
                  {% set managed_file = 'C:\\ProgramData\\guestcfg\\managed.conf' if grains['os_family'] == 'Windows' else '/etc/guestcfg/managed.conf' %}

                  guestcfg-managed-file:
                    file.managed:
                      - name: {{ managed_file }}
                      - makedirs: True
                      - contents: |
                          managed-by: salt
                          baseline: guest-configuration
              - path: /srv/salt/guestcfg/drift.sls
                permissions: '0644'
                content: |
                  # The drift for step 6: the same file, changed outside the baseline. It goes through a
                  # state because the run's API account holds only the state.apply right, no file-write
                  # right; a real change arrives another way, and the baseline answers it the same.
                  {% set managed_file = 'C:\\ProgramData\\guestcfg\\managed.conf' if grains['os_family'] == 'Windows' else '/etc/guestcfg/managed.conf' %}

                  guestcfg-managed-file-drift:
                    file.managed:
                      - name: {{ managed_file }}
                      - contents: |
                          managed-by: someone-else
              - path: /srv/salt/guestcfg/probe.sls
                permissions: '0644'
                content: |
                  # The probes: reads only, and nothing on the guest changes. The minion reads its own key with the
                  # functions salt-call --local runs, called by the minion itself while it renders this file, so the
                  # probe needs no path to salt-call on either system. The run compares the public key itself with
                  # the one the master holds for this minion's id; on Salt 3008.5 the two fingerprints differ for the
                  # same key, so they are recorded and never compared to decide trust (G-980).
                  {% set own_fingerprint = salt['key.finger']() %}
                  {% set own_sha256 = salt['key.finger'](hash_type='sha256') %}
                  {% set hash_type = salt['config.get']('hash_type') %}
                  {% set pki_dir = salt['config.get']('pki_dir') %}
                  {% set own_pub = salt['file.read'](pki_dir ~ '/minion.pub') %}
                  {% set own_pub_head = own_pub.splitlines()[0] if own_pub else 'unread' %}
                  {% set own_pub_body = own_pub.splitlines()[1:-1] | join('') if own_pub else 'unread' %}
                  {% set own_pub_lines = own_pub.splitlines() | map('length') | join(',') if own_pub else 'unread' %}
                  {% set own_pub_file_sha256 = salt['file.get_hash'](pki_dir ~ '/minion.pub', 'sha256') %}

                  guestcfg-probe-own-fingerprint:
                    test.show_notification:
                      - text: 'own-fingerprint {{ own_fingerprint }}'

                  # The same fingerprint with SHA-256 named, the hash type this minion defaults to, and the first line of its public key,
                  # which names the key's PEM form: what tells a different key from the same key hashed or stored differently.
                  guestcfg-probe-own-sha256:
                    test.show_notification:
                      - text: 'own-sha256 {{ own_sha256 }}'

                  guestcfg-probe-hash-type:
                    test.show_notification:
                      - text: 'hash-type {{ hash_type }}'

                  guestcfg-probe-pub-head:
                    test.show_notification:
                      - text: 'pub-head {{ own_pub_head }}'

                  # The public key itself, its body joined into one line, and the length of each of its lines: a public key is public,
                  # and the two tell the same key written in another layout from a different key.
                  guestcfg-probe-pub-body:
                    test.show_notification:
                      - text: 'pub-body {{ own_pub_body }}'

                  guestcfg-probe-pub-lines:
                    test.show_notification:
                      - text: 'pub-lines {{ own_pub_lines }}'

                  # SHA-256 of the whole minion.pub file. Salt 3008.5's master fingerprints the whole PEM it holds for an id, where the
                  # minion's key.finger hashes only the lines between the header and the footer, so the two fingerprints differ for the
                  # same key; a hash of the whole file is the minion-side read that can match the master's.
                  guestcfg-probe-pub-file-sha256:
                    test.show_notification:
                      - text: 'pub-file-sha256 {{ own_pub_file_sha256 }}'

                  # Where this minion keeps its key pair, as its own configuration resolves it: the directory a key generated on the
                  # master would be seeded into on this system.
                  guestcfg-probe-pki-dir:
                    test.show_notification:
                      - text: 'pki-dir {{ pki_dir }}'
                  {% if grains['os_family'] == 'Windows' %}

                  # The sessions signed in on Windows, read with quser. Under the minion service quser reported no
                  # signed-in user with exit 0 and "No User exists for *" on stderr (G-982); 1 counts as success too.
                  # The run records the exit, stdout and stderr, and judges on the text.
                  guestcfg-probe-signed-in-sessions:
                    cmd.run:
                      - name: quser
                      - success_retcodes:
                        - 1
                  {% endif %}
              # Everything needing the network or the salt user: the signing key, the pinned 3008.5
              # packages, a check that salt-api's web server (CherryPy, which salt-common 3008.5 carries
              # in Salt's own Python) imports, then the configuration files, owned so salt reads them.
              # Nothing is installed from the Python Package Index.
              - path: /opt/guestcfg/install.sh
                permissions: '0700'
                content: |
                  #!/bin/bash
                  set -uo pipefail
                  export DEBIAN_FRONTEND=noninteractive
                  log() { echo "[guestcfg $(date -u +%H:%M:%SZ)] $*"; }
                  retry() { local left=$1; shift; until "$@"; do left=$((left-1)); [ "$left" -gt 0 ] || return 1; log "retrying: $*"; sleep 20; done; }
                  fetch_key() { curl -fsSL --retry 3 --retry-delay 5 "https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public" | gpg --dearmor --yes -o /etc/apt/keyrings/salt-archive-keyring.pgp; }
                  apt_up() { apt-get -o DPkg::Lock::Timeout=300 update; }
                  install -d -m 755 /etc/apt/keyrings
                  retry 6 fetch_key || { log "the Salt signing key could not be fetched"; exit 1; }
                  install -m 0644 /opt/guestcfg/salt.sources /etc/apt/sources.list.d/salt.sources
                  install -m 0644 /opt/guestcfg/salt-pin /etc/apt/preferences.d/salt-pin-1001
                  retry 6 apt_up || { log "the Salt repository could not be read"; exit 1; }
                  apt_in() { apt-get -o DPkg::Lock::Timeout=300 install -y salt-common=3008.5 salt-master=3008.5 salt-api=3008.5; }
                  retry 3 apt_in || { log "the Salt master packages did not install"; exit 1; }
                  apt-mark hold salt-common salt-master salt-api
                  if /opt/saltstack/salt/bin/python3 -c 'import cherrypy'; then log "CherryPy imports in Salt's own Python: salt-api has its web server"; else log "CherryPy does not import in Salt's own Python: salt-api cannot serve"; fi
                  install -d -o root -g salt -m 0750 /etc/salt/guestcfg
                  install -o root -g salt -m 0640 /opt/guestcfg/api.digest /etc/salt/guestcfg/api.digest
                  install -o root -g salt -m 0640 /opt/guestcfg/api.crt /etc/salt/guestcfg/api.crt
                  install -o root -g salt -m 0640 /opt/guestcfg/api.key /etc/salt/guestcfg/api.key
                  install -m 0644 /opt/guestcfg/master.conf /etc/salt/master.d/guestcfg.conf
                  systemctl enable salt-master salt-api
                  systemctl restart salt-master
                  sleep 10
                  systemctl restart salt-api
                  log "salt-master and salt-api restarted with the run's configuration"
            runcmd:
              - [bash, /opt/guestcfg/install.sh]

  # The master, as in salt-master.vm.yaml: Ubuntu 24.04, cloud-init from the Secret
  # above. Its own address on the namespace network is what each minion dials.
  MasterVM:
    type: CCI.Supervisor.Resource
    dependsOn:
      - Bootstrap
    properties:
      context: ${resource.Namespace.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachine
        metadata:
          name: ${input.app_name}-master
          labels:
            app: ${input.app_name}-master
            app.kubernetes.io/name: ${input.app_name}-master
            app.kubernetes.io/component: salt-master
            app.kubernetes.io/part-of: guest-configuration
            app.kubernetes.io/managed-by: vcf-automation
            handbook-guestcfg-run: '${input.run_label}'
        spec:
          className: ${input.vm_class}
          imageName: ${input.vm_image}
          storageClass: ${input.storage_class}
          powerState: PoweredOn
          bootstrap:
            cloudInit:
              rawCloudConfig:
                name: ${input.app_name}-master-bootstrap
                key: user-data

  # The API's front door: port 8000 and nothing else, selecting the master. Minions
  # dial OUT to the master on 4505 and 4506 inside the VPC, so those two ports need no
  # load balancer. The wait holds the deployment until the load balancer has an
  # address, as the house blueprints do for a LoadBalancer; that address is not an
  # output here, for the same reason the master's is not (see the header).
  ApiService:
    type: CCI.Supervisor.Resource
    dependsOn:
      - MasterVM
    properties:
      context: ${resource.Namespace.id}
      wait:
        fields:
          - path: status.loadBalancer.ingress[0].ip
            value: '*'
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha5
        kind: VirtualMachineService
        metadata:
          name: ${input.app_name}-api
          labels:
            app: ${input.app_name}-api
            app.kubernetes.io/name: ${input.app_name}-api
            app.kubernetes.io/component: salt-api
            app.kubernetes.io/part-of: guest-configuration
            app.kubernetes.io/managed-by: vcf-automation
            handbook-guestcfg-run: '${input.run_label}'
        spec:
          type: LoadBalancer
          selector:
            app: ${input.app_name}-master
          ports:
            - name: salt-api
              protocol: TCP
              port: 8000
              targetPort: 8000
          loadBalancerSourceRanges: ${input.api_source_ranges}

# -----------------------------------------------------------------------------
# OUTPUTS
# -----------------------------------------------------------------------------
outputs:

  namespace_name:
    description: The Supervisor namespace the master landed in.
    value: ${resource.Namespace.name}

  master_name:
    description: The master's machine name, which is also its host name.
    value: ${input.app_name}-master

  read_the_master_address:
    description: >-
      The master's own address on the namespace network: give it to each minion
      blueprint as salt_master_address. The address arrives once the machine is
      PoweredOn, so this is the command that reads it then.
    value: "kubectl get virtualmachine ${input.app_name}-master -n ${input.target_namespace_name} -o jsonpath='{.status.network.primaryIP4}'"

  read_the_api_address:
    description: >-
      The Salt API's address on the load balancer. https://<address>:8000/login takes
      the guestcfg-api account over TLS; pin the certificate you gave as
      api_tls_cert_b64.
    value: "kubectl get virtualmachineservice ${input.app_name}-api -n ${input.target_namespace_name} -o jsonpath='{.status.loadBalancer.ingress[0].ip}'"
