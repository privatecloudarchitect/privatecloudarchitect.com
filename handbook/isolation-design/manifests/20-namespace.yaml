# The workload namespace for the proof.
#
# Every <your-...> value is estate-specific. The reliable way to fill them is to copy
# the spec from a namespace that already works on your estate:
#   kubectl get supervisornamespaces -n <existing-project> <existing-namespace> -o yaml
#
# Watch points:
# - Name the namespace with generateName, not a fixed name. The resource derives its own
#   name and appends a suffix, so a fixed metadata.name is rejected (an opaque
#   "Validation failed" on a server-side apply, or a clear "name cannot be specified" on a
#   create). Create this with `kubectl create -f`, which supports generateName; `kubectl
#   apply` keys on a fixed name and is the wrong verb here.
# - segName is required on a region whose load balancing is registered through NSX (set below).
# - The region the namespace names must exist on your organization; no per-project console
#   step is needed. This resource does not support --dry-run=server.
apiVersion: infrastructure.cci.vmware.com/v1alpha3
kind: SupervisorNamespace
metadata:
  generateName: rbac-lab-apps-
  namespace: rbac-lab
spec:
  className: <your-namespace-class>
  regionName: <your-region>
  vpcName: <your-vpc>
  segName: <your-seg>
  description: "Isolation-proof workload namespace (lightweight, ConfigMap-only deployments)."
  infraPolicyNames: []
  sharedSubnetNames: []
  classConfigOverrides:
    storageClasses:
    - name: <your-storage-class>
      limit: <your-storage-limit>
    zones:
    - name: <your-zone>
      cpuLimit: <your-cpu-limit>
      cpuReservation: 0M
      memoryLimit: <your-memory-limit>
      memoryReservation: 0Mi
      vmClassReservations: []
