# Well-Tuned Private Cloud — posture: stage-business-critical-vm  (catalog P6)
#
# PORTABLE, machine-readable source for one posture. Instance-independent: tag rules, envelope values,
# and the policy capacityDefinition are data, not state.
#
# Provenance: the framework's posture catalog.
#
# P6 is P2 read through the TIER lens (T1-T4): IDENTICAL targets (staging rehearses production), bands
# widened ~2x (T2 tolerance), floor relaxed (T3), and breach routes as a TICKET not an incident (T4).
#
# STATUS: envelope values are PROPOSED (operator-judgment defaults on an envelope-review
# cadence), transcribed as-proposed. diskspace + poweredOffVmsConsidered + drs are INFERRED (marked).

posture: stage-business-critical-vm
sla: business-critical         # same SLA CLASS as P2; the stage tier relaxes bands + response, not the target
tier: stage
archetype: traditional
min_tier: standard             # infra-tier REQUIREMENT (≠ env `tier` above): the least-premium hardware class in
                               # tiers/ that satisfies this posture; verified `== fit` by `python _tiers.py --self-test`.

# --- Stable content identity (elevator seam; read via _postures.py) ---
content_ids: {ordinal: 6, view_prefix: p6, view: c06d, dashboard: d06d, widget: e06d, tab: 0a6d}

# --- Step 1: membership (tag rule) ---
# Membership rule: env=stage ∧ sla=sla-2. env=stage is disjoint from every prod posture, so no priority
# tie-break is needed against P2 (same sla-2, different env).
membership:
  env: stage
  sla: sla-2                   # sla-2 = business-critical (README Tags)

# --- Step 3: custom groups (follows-the-workload) ---
groups:
  - name: "PCA - WTPC - Group - stage-business-critical-vm (VMs)"
    resource_kind: VirtualMachine
    membership: [{category: env, value: stage}, {category: sla, value: sla-2}]
  - name: "PCA - WTPC - Group - stage-business-critical-vm (Clusters)"
    resource_kind: ClusterComputeResource
    derived: ancestor-clusters-of-vms-group
  - name: "PCA - WTPC - Group - stage-business-critical-vm (Hosts)"
    resource_kind: HostSystem
    derived: parent-hosts-of-vms-group

# --- Availability FLOOR (posture catalog) — relaxed vs P2 (T3) ---
availability_floor:
  ha: required                 # HA on (admission control enabled), but no dedicated failover guarantee (n_plus 0)
  ha_admission_control: enabled          # the posture catalog: enabled, admission % may be relaxed vs prod (T3) (not yet live-verified)
  n_plus: 0                    # the posture catalog: restart capacity, no dedicated failover guarantee
  drs_minimum: fully_automated # inferred: stage rehearses prod → full DRS (not yet live-verified)
  anti_affinity: none

# --- Step 4: the enforcement copy (policy) ---
policy:
  name: "PCA - WTPC - Policy - stage-business-critical-vm"
  clone_from: Default
  capacity_allocation:
    cpu: 3.0                           # = cpu_overcommit target; same target as P2
    memory: 1.25                       # = mem_overcommit target; same target as P2
    diskspace: 2.5                     # inferred: 2 x mem_target
    poweredOffVmsConsidered: false     # inferred: stage - a powered-off stage VM does not reserve a slot
  capacity_buffer:                     # pct = round(100*(1 - target/warn)); the ~2x-wider bands make these larger than P2
    memory_pct: 38                     # 100*(1 - 1.25/2.0)
    cpu_pct: 50                        # 100*(1 - 3.0/6.0)
  criticality: Aggressive              # the posture catalog (P4/P5/P6/P7 = Aggressive)

# --- The envelope (target/warn/breach per pillar) — the posture catalog, PROPOSED ---
# Targets == P2; warn/breach widened ~2x (T2). Read against P2 to see tier modulation in one column.
envelope:
  capacity:
    mem_overcommit: {target: 1.25, warn: 2.0, breach: 3.0}         # target == P2; bands ~2x wider (T2)
    cpu_overcommit: {target: 3.0,  warn: 6.0, breach: 8.0}
  performance:
    cpu_ready_pct_p95:      {target: 2.0, warn: 8.0, breach: 12.0} # target == P2; bands widened
    mem_contention_pct_p95: {target: 0.0, warn: 2.0, breach: 4.0}  # statkey (not yet live-verified)
    protection_coverage:    optional
  cost:
    reclaimable_pct: {target: 10, warn: 25, breach: 40}

notes:
  - Same targets as P2 prod-business-critical-vm (staging rehearses production, T1); bands widened ~2x (T2), floor relaxed (T3, n_plus 0).
  - Breach here routes as a TICKET, not an incident (T4) - the response tier, owned by the central glue doc (EXECUTION P1 step 2), not a color change here.
  - Envelope values are PROPOSED - reconcile at the pillar-leaf pass (posture catalog).
